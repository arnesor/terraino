# What ISOM 2000 symbols mean for the 3D world.
#
# Keys (all optional):
#   ground  ground class: forest open rough marsh rock field paved gravel path water
#           lawn stony sand building (see otest.process.symbols.Ground)
#   trees   "keep" (laser canopy trees, plus smaller trees below the canopy up to the
#           SR16 count), "lidar" (only the trees the laser finds), "scattered" (a few
#           of the laser's trees, the tallest, far apart) or "none"
#   young   young trees added per 100 m², making the forest denser
#   shrubs  undergrowth density, 0..1
#   speed   running speed factor, 1 = easy forest floor, 0 = impassable
#   width   real-world width in metres of a line symbol, painted with its ground class
#   clear   width in metres of a tree-free strip along a line symbol
#   order   drawing order; higher values are painted on top
#   feature 3D object placed for the symbol: boulder, boulder_cluster, boulder_field,
#           stones, cliff, rock_face, stone_wall, ruined_wall, fence, ruined_fence,
#           power_line, pylon_line, tower, cairn, fodder_rack, ruin, footbridge
#   size    size of the feature in metres (boulder height, tower height, wall height)
#   track   roads and paths drawn as their own strip on the terrain, with sharp edges:
#           paved, gravel, vehicle_track, path, small_path, faint_path, or for water
#           lines stream, small_stream and water_channel
#   overprint  true for a pattern drawn on top of other areas (undergrowth): it only adds
#           its shrubs and speed, and keeps the ground and trees of the area below
#
# A symbol "406.1" uses the entry "406.1" if there is one, otherwise "406".
# The white map background is forest with easy running.

name = "ISOM 2000"

[symbols]
# Rock and stones
"201" = { feature = "cliff", speed = 0 }
