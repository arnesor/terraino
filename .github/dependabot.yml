version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 99
    groups:
      github-action-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "pip"
    directory: "/.github/workflows"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 99
    groups:
      workflows-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    versioning-strategy: lockfile-only
    open-pull-requests-limit: 99
    groups:
      python-dependencies:
        patterns:
          - "*"
  # The viewer and the OCAD exporter pin exact versions, so Dependabot raises the
  # pins in package.json along with package-lock.json.
  - package-ecosystem: "npm"
    directories:
      - "/viewer"
      - "/tools/ocad-export"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 99
    ignore:
      # @types/node follows the Node major version in .node-version.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-dependencies:
        patterns:
          - "*"
